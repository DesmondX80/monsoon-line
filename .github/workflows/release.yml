name: Release

# Rakentaa Windows-.exe:n ja liittää sen GitHub-julkaisuun, kun
# - julkaisu julkaistaan GitHubin verkkosivulla (Releases → Draft a new release),
# - pushataan versiotagi (esim. v0.1.0), tai
# - työnkulku käynnistetään käsin (Actions → Release → Run workflow) ja annetaan versio:
#   silloin työnkulku luo tagin ja julkaisun itse nykyisestä main-haarasta.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versio, esim. v0.1.0 (tyhjä = vain rakennus ilman julkaisua)"
        required: false
        default: ""

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
      VERSION: ${{ inputs.version || github.ref_name }}
      PUBLISH: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot and export templates
        run: |
          mkdir -p ~/godot
          if [ ! -f ~/godot/godot ]; then
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$TPL/windows_release_x86_64.exe" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mkdir -p "$TPL"
            unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mv templates/* "$TPL"/
          fi

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --import --quit || true
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/MonsoonLine.exe
          test -s build/windows/MonsoonLine.exe
          cd build/windows && zip -q ../MonsoonLine-windows-${VERSION}.zip MonsoonLine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MonsoonLine-windows
          path: build/MonsoonLine-windows-*.zip

      - name: Release notes from CHANGELOG
        if: env.PUBLISH == 'true'
        run: |
          V="${VERSION#v}"
          awk -v v="$V" '$0 ~ "^## "v" " {p=1; next} /^## / {p=0} p' CHANGELOG.md > build/notes.md
          [ -s build/notes.md ] || echo "Monsoon Line ${VERSION}" > build/notes.md

      - name: Create or update GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Monsoon Line ${{ env.VERSION }}
          body_path: build/notes.md
          files: build/MonsoonLine-windows-*.zip
