name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (headless)
        run: |
          GODOT_VERSION=4.4.1
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
      - name: Import project and check scripts
        run: ./godot --headless --import --quit
      # TODO(tester): lisää GUT-testien ajo, kun addons/gut on repossa:
      # ./godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
